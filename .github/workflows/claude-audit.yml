name: Audit

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  audit:
    name: Lint · Types · Security report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install
        env:
          HUSKY: 0

      - name: Run audit script
        run: node scripts/claude-audit.mjs

      - name: Commit audit file
        run: |
          git config user.name  "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git add audits/
          git diff --cached --quiet || git commit -m "audit: $(git log -1 --format='%s' HEAD~1 2>/dev/null || echo 'latest commit') [skip ci]"
          git push
