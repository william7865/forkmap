name: Claude Autofix

on:
  issue_comment:
    types: [created]

  pull_request:
    types: [opened, synchronize, reopened]

  issues:
    types: [labeled]

  workflow_dispatch:
    inputs:
      task:
        description: "What should Claude do?"
        required: false
        default: "Review the entire codebase, fix bugs, TypeScript errors, and code quality issues. Run npm install && npm run lint && npm run type-check to verify. Commit each fix separately."

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write   # required by claude-code-action to authenticate

jobs:
  # ── Interactive / label / manual / scheduled ────────────────
  claude-agent:
    name: Claude Code Agent
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.label.name == 'auto-fix')

    steps:
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: "${{ github.event.inputs.task || 'Full health check: find and fix TypeScript errors, lint warnings, runtime bugs, and security issues. Run npm install && npm run lint && npm run type-check after each change. Commit each fix with a clear message.' }}"
          allowed_tools: "Bash,Edit,Read,Write,Glob,Grep"
          custom_instructions: |
            Next.js 15 + TypeScript strict + Tailwind + Supabase + Leaflet app.
            - Run npm install (not npm ci) with HUSKY=0 env var
            - Leaflet MapView MUST use dynamic(() => import(...), { ssr: false })
            - Never hardcode display text — use useLanguage + lib/i18n/translations.ts
            - Never commit .env files or API keys
            - Prefer editing existing files over creating new ones

  # ── PR review + auto-fix ─────────────────────────────────────
  claude-pr-fix:
    name: Claude PR Review & Fix
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            Review the changes in this pull request.
            1. Run `npm install` (HUSKY=0) then `npm run lint` and `npm run type-check` and fix every error.
            2. Check the diff for bugs, type errors, missing null checks, security issues.
            3. Fix issues directly and commit with descriptive messages.
            4. If everything looks good, leave a brief comment saying so.
            Be precise and minimal — only touch what is broken.
          allowed_tools: "Bash,Edit,Read,Write,Glob,Grep"
          custom_instructions: |
            Next.js 15 + TypeScript strict + Tailwind + Supabase + Leaflet app.
            - Run npm install (not npm ci) with HUSKY=0 env var
            - Leaflet MapView MUST use dynamic(() => import(...), { ssr: false })
            - Never hardcode display text — use useLanguage + lib/i18n/translations.ts
            - Never commit .env files or API keys
